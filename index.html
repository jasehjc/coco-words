let wi=SCHEDULE.findIndex(w=>todayNum>=toNum(w.s)&&todayNum<=toNum(w.e));if(wi<0)wi=todayNum<toNum('2026-09-07')?0:SCHEDULE.length-1;let previewFormal=false;
const wk=()=>SCHEDULE[wi],weekState=()=>state.weeks[wi]||(state.weeks[wi]={tasks:{}}),dayState=()=>state.days[todayKey]||(state.days[todayKey]={word:false,focus:null,busy:false,focusIndex:0});
function save(msg=true){localStorage.setItem(STORAGE,JSON.stringify(state));if(msg){const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),750)}}
function phase(){if(trial&&!previewFormal)return ['试运行','正式开始前'];if(wi<=3)return ['词汇打底',`Week ${wi+1} / 14`];if(wi<=7)return ['分题型训练',`Week ${wi+1} / 14`];if(wi<=11)return ['真题主导',`Week ${wi+1} / 14`];return ['冲刺',`Week ${wi+1} / 14`]}
function taskCount(id){return Number(weekState().tasks[id]||0)}function setCount(id,n){const target=wk().tasks.find(t=>t.id===id)?.target||0;weekState().tasks[id]=Math.max(0,Math.min(target,n))}
function wordDays(){const w=wk();return Object.entries(state.days).filter(([k,v])=>toNum(k)>=toNum(w.s)&&toNum(k)<=toNum(w.e)&&v.word).length}
function pct(){const w=wk(),wp=Math.min(1,wordDays()/w.wordTarget);const others=w.tasks.length?w.tasks.reduce((a,t)=>a+Math.min(1,taskCount(t.id)/t.target),0)/w.tasks.length:1;return Math.round((wp*.4+others*.6)*100)}
function streak(){let c=0,n=todayNum;for(;;n--){const d=new Date(n*86400000),k=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`,v=state.days[k];if(v&&(v.word||v.focus))c++;else if(n===todayNum){continue}else break}return c}
function incompleteTasks(){return wk().tasks.filter(t=>taskCount(t.id)<t.target)}
function focusTask(){let a=incompleteTasks();if(!a.length)a=wk().tasks;let i=dayState().focusIndex||0;return a[i%a.length]||wk().tasks[0]}
function renderToday(){
 const effectiveTrial=trial&&!previewFormal;const [ph,wno]=phase();$('#phase').textContent=ph;$('#weekNo').textContent=wno;$('#stageText').textContent=effectiveTrial?'试运行':`${ph} · Week ${wi+1}`;$('#dateLine').textContent=`${now.getMonth()+1} 月 ${now.getDate()} 日 · 距六级 ${remain} 天`;
 $('#previewBtn').classList.toggle('hidden',!trial);$('#previewBtn').textContent=previewFormal?'返回试运行':'预览正式模式';$('#trialBox').classList.toggle('hidden',!effectiveTrial);$('#taskBox').classList.toggle('hidden',effectiveTrial);$('#statsBox').classList.toggle('hidden',effectiveTrial);$('#swapBtn').classList.toggle('hidden',effectiveTrial);$('#busyBtn').classList.toggle('hidden',effectiveTrial);
 if(effectiveTrial){$('#taskLabel').textContent='正式开始前';$('#timeText').textContent='随便试试';$('#trialBox').innerHTML='<div class="trial"><div class="trial-title">装好背词 App</div><div class="trial-sub">选六级词书，试背 10–20 分钟。</div></div><div class="trial"><div class="trial-title">翻一下星火真题</div><div class="trial-sub">只熟悉题型，不正式做。</div></div><div class="trial"><div class="trial-title">试听一小段</div><div class="trial-sub">感受难度即可，不记成绩。</div></div>';return}
 const d=dayState(),f=focusTask();$('#busyBtn').textContent=d.busy?'普通模式':'忙碌模式';$('#timeText').textContent=d.busy?'10 min':'45 min';$('#wordSub').textContent=d.busy?'10 分钟 · 只复习也可以':(wi<=3?'25 分钟 · 50–70 个':wi<=7?'20–25 分钟 · 30–50 个':wi<=11?'15–20 分钟 · 真题词为主':'10–15 分钟 · 只复习');
 $('#focusTask').classList.toggle('hidden',d.busy);$('#focusTitle').textContent=f.label;$('#focusSub').textContent=`${f.duration} · ${f.sub}`;
 $('#wordTask').classList.toggle('done',d.word);$('#wordTask .check').textContent=d.word?'✓':'';const fd=d.focus===f.id;$('#focusTask').classList.toggle('done',fd);$('#focusTask .check').textContent=fd?'✓':'';
 $('#todayDone').classList.toggle('hidden',!(d.word&&(d.busy||fd)));const p=pct();$('#weekPct').textContent=p;$('#weekFill').style.width=p+'%';$('#reward').classList.toggle('hidden',p<70);$('#wordStat').textContent=`${wordDays()} / ${wk().wordTarget}`;
 const shown=wk().tasks.slice(0,2);$('#stat2Label').textContent=shown[0]?.label||'专项';$('#stat2').textContent=shown[0]?`${taskCount(shown[0].id)} / ${shown[0].target}`:'—';$('#stat3Label').textContent=shown[1]?.label||'专项';$('#stat3').textContent=shown[1]?`${taskCount(shown[1].id)} / ${shown[1].target}`:'—';$('#streak').textContent=streak();
}
function renderPlan(){
 const w=wk();$('#planDate').textContent=(trial&&previewFormal?'正式模式预览 · ':'')+`Week ${wi+1} · ${w.s.slice(5).replace('-','/')} — ${w.e.slice(5).replace('-','/')}`;$('#weekTitle').textContent=w.title;
 let rows=`<div class="progress-task"><span><span class="tasktitle" style="font-size:15px">单词</span><span class="tasksub">${wi<=3?'20–30 分钟 / 天':'持续不断线'}</span></span><span class="count">${wordDays()} / ${w.wordTarget} 天</span></div>`;
 rows+=w.tasks.map(t=>`<button class="progress-task" data-progress="${t.id}"><span><span class="tasktitle" style="font-size:15px">${t.label}</span><span class="tasksub">${t.duration}</span></span><span class="count">${taskCount(t.id)} / ${t.target} ${t.unit}</span></button>`).join('');$('#weeklyTasks').innerHTML=rows;
 $$('[data-progress]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.progress,set=wk().tasks.find(t=>t.id===id);let n=taskCount(id)+1;if(n>set.target)n=0;setCount(id,n);save();renderAll()}));
 $('#weekList').innerHTML=SCHEDULE.map((x,i)=>`<div class="weekrow ${i===wi?'active':''}"><div class="wtop"><div class="wtitle">W${i+1} · ${x.title}</div><div class="wdate">${x.s.slice(5).replace('-','/')}–${x.e.slice(5).replace('-','/')}</div></div><div class="wsub">单词 · ${x.tasks.map(t=>t.label).join(' · ')}</div></div>`).join('');
}
function renderRecord(){
 const p=pct();$('#recordStreak').textContent=streak();$('#recordPct').textContent=p+'%';$('#paperCount').textContent=state.papers.length;const list=$('#paperList');
 if(!state.papers.length)list.innerHTML='<div class="empty">还没有记录</div>';else{list.innerHTML='';state.papers.forEach((x,i)=>{const r=document.createElement('div');r.className='paperrow';r.innerHTML=`<span>${x.name}</span><button class="status">${['未开始','进行中','已完成'][x.status]}</button>`;r.querySelector('button').addEventListener('click',()=>{x.status=(x.status+1)%3;save();renderRecord()});list.appendChild(r)})}
 const hist=[];for(let i=0;i<=wi;i++){const w=SCHEDULE[i],ws=state.weeks[i]||{tasks:{}};const words=Object.entries(state.days).filter(([k,v])=>toNum(k)>=toNum(w.s)&&toNum(k)<=toNum(w.e)&&v.word).length;const wp=Math.min(1,words/w.wordTarget);const other=w.tasks.length?w.tasks.reduce((a,t)=>a+Math.min(1,Number(ws.tasks[t.id]||0)/t.target),0)/w.tasks.length:1;hist.push([`W${i+1}`,Math.round((wp*.4+other*.6)*100)])}
 $('#historyList').innerHTML=hist.slice(-5).reverse().map(h=>`<div class="histrow"><span>${h[0]}</span><span>${h[1]}% ${h[1]>=70?'· 达标':''}</span></div>`).join('');
}
function renderSettings(){$('#reminderTime').value=state.settings.reminderTime;$('#reminderEnabled').checked=state.settings.reminderEnabled;$('#reminderPreview').textContent=state.settings.reminderEnabled?`${state.settings.reminderTime} · 今天的六级计划看一眼？`:'已关闭'}
function renderAll(){renderToday();renderPlan();renderRecord();renderSettings()}
$('#wordTask').addEventListener('click',()=>{const d=dayState();d.word=!d.word;save();renderAll()});
$('#focusTask').addEventListener('click',()=>{const d=dayState(),f=focusTask();if(d.focus===f.id){d.focus=null;setCount(f.id,taskCount(f.id)-1)}else{if(d.focus){setCount(d.focus,taskCount(d.focus)-1)}d.focus=f.id;setCount(f.id,taskCount(f.id)+1)}save();renderAll()});
$('#swapBtn').addEventListener('click',()=>{const d=dayState();d.focusIndex=(d.focusIndex||0)+1;d.focus=null;save(false);renderToday()});
$('#previewBtn').addEventListener('click',()=>{previewFormal=!previewFormal;renderToday();renderPlan();renderRecord()});
$('#busyBtn').addEventListener('click',()=>{dayState().busy=!dayState().busy;save();renderToday()});
$('#addPaper').addEventListener('click',()=>{state.papers.push({name:`真题 ${state.papers.length+1}`,status:0});save();renderRecord()});
$('#settingsBtn').addEventListener('click',()=>$('#settings').classList.toggle('hidden'));$('#closeSettings').addEventListener('click',()=>$('#settings').classList.add('hidden'));
$('#reminderTime').addEventListener('change',e=>{state.settings.reminderTime=e.target.value;save();renderSettings()});$('#reminderEnabled').addEventListener('change',e=>{state.settings.reminderEnabled=e.target.checked;save();renderSettings()});
$('#exportBackup').addEventListener('click',()=>{
  try{
    const payload={app:'抠抠单词',exportedAt:new Date().toISOString(),data:state};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`抠抠单词备份_${todayKey}.json`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){alert('导出失败，请稍后再试。')}
});
$('#importBackup').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const raw=await file.text(),parsed=JSON.parse(raw),incoming=parsed&&parsed.data?parsed.data:parsed;
    if(!incoming||typeof incoming!=='object'||!incoming.days||!incoming.weeks||!incoming.settings)throw new Error('bad');
    state=incoming;state.settings=state.settings||structuredClone(DEFAULT.settings);state.days=state.days||{};state.weeks=state.weeks||{};state.papers=state.papers||[];
    save();renderAll();alert('备份已导入。');
  }catch(err){alert('这不是有效的抠抠单词备份文件。')}
  e.target.value='';
});
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;['today','plan','record'].forEach(n=>$('#'+n+'View').classList.toggle('hidden',n!==v));$$('[data-view]').forEach(x=>x.classList.toggle('on',x===b));$('#settings').classList.add('hidden')}));
renderAll();
})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});</script>
